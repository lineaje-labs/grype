name: "Release Lineaje"
on:
  workflow_dispatch:
    inputs:
      version:
        description: provide the tag to build and release (prefixed with v)
        required: true

permissions:
  contents: read

jobs:
  release:
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-depth: 0

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          # use the same cache we used for building snapshots
          build-cache-key-prefix: "snapshot"

      - name: Build & publish release artifacts
        run: make ci-release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # for creating the release (requires write access to packages and content)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        continue-on-error: true
        with:
          artifact-name: sbom.spdx.json

